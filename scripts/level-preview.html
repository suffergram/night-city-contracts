<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Генератор локаций — Night City Contracts</title>
<style>body{margin:0;padding:16px;background:#10121e;color:#f0bdce;font:14px system-ui}header{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:12px}button,select,input{background:#291c2c;color:#f0bdce;border:1px solid #805267;padding:7px}input[type=range]{padding:0;accent-color:#eb77a0}canvas{display:block;width:min(100%,1400px);height:auto;border:1px solid #4e3445}#summary{margin:12px 0;color:#b9c6cb}</style>
<header><select id="kind"><option value="">Случайная локация</option value="industrial">Промзона</option><option value="port">Порт</option><option value="market">Рынок</option><option value="megablock">Мегаздание</option></select><button id="new">Новая планировка</button><label>Seed <input id="seed" type="number" value="42" style="width:110px"></label><button id="same">Показать seed</button><label>X <input id="camera" type="range" value="0" min="0" max="3000"></label><label>Этаж <input id="vertical" type="range" value="0" min="-800" max="0"></label></header>
<canvas id="preview" width="1200" height="660"></canvas><div id="summary"></div>
<script type="module">
import {generateLevel,freshLevelSeed,DEFAULT_PROFILE} from '../src/world.js';
import {drawWorld} from '../src/render.js';
import {preloadEnvironment} from '../src/environment.js';
import {preloadSprites} from '../src/raster.js';
const canvas=document.getElementById('preview'),ctx=canvas.getContext('2d');let world,time=0,last=0;
await Promise.all([preloadEnvironment(),preloadSprites()]);
function regenerate(seed=Number(document.getElementById('seed').value),kind=document.getElementById('kind').value){
  world=generateLevel(1,seed,kind);document.getElementById('seed').value=world.seed;
  document.getElementById('camera').max=Math.max(0,world.width-canvas.width);document.getElementById('camera').value=0;
  document.getElementById('vertical').min=world.top;document.getElementById('vertical').value=0;
  document.getElementById('summary').textContent=world.name+' · '+world.width+'px · '+world.floors.length+' ярусов · '+world.enemies.length+' врагов · '+world.chests.length+' тайника';
  draw();return world;
}
function draw(){if(!world)return;const camera=Number(document.getElementById('camera').value),cameraY=Number(document.getElementById('vertical').value);
  const player={x:world.spawn.x,y:world.spawn.y-60,w:20,h:60,grounded:true,facing:world.spawn.x>world.width/2?-1:1,activeWeapon:'weapon',vx:0,vy:0,animation:{name:'idle',time}};
  drawWorld(ctx,canvas,{mode:'expedition',world,player,profile:DEFAULT_PROFILE,camera,cameraY,time,particles:[],floats:[],bullets:[],shake:0,mouse:{active:false}});
}
document.getElementById('new').onclick=()=>regenerate(freshLevelSeed());document.getElementById('same').onclick=()=>regenerate();document.getElementById('kind').onchange=()=>regenerate();
window.levelPreview={generate:regenerate,getWorld:()=>world,setCamera(x,y=0){document.getElementById('camera').value=x;document.getElementById('vertical').value=y;draw();}};
regenerate();window.levelPreviewReady=true;
function frame(now){time+=last?Math.min(.05,(now-last)/1000):0;last=now;draw();requestAnimationFrame(frame);}requestAnimationFrame(frame);
</script></html>
